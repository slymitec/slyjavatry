server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    import: classpath:ai.yml

  task:
    execution:
      pool:
        core-size: 16
        keep-alive: 4s

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  redis:
    redisson:
      config: |
        codec: !<org.redisson.codec.Kryo5Codec> {}
        singleServerConfig:
          address: "redis://10.28.0.16:6379"

  #org:
